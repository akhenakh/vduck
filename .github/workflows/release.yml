name: Publish Go Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Release
        run: |
          docker run --rm --privileged \
            -v "$PWD":/go/src/vduck \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /go/src/vduck \
            -e GITHUB_TOKEN \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.3 \
            release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          
